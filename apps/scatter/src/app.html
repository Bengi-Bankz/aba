<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
        <link rel="stylesheet" href="app.css" />

        <meta name="viewport" content="width=device-width" />
        
        <!-- NUCLEAR CONSOLE SUPPRESSION - Execute immediately -->
        <script>
            // Disable ALL console output immediately
            console.warn = function() {};
            console.log = function() {};
            console.error = function() {};
            console.info = function() {};
            console.debug = function() {};
            console.trace = function() {};
            
            // Also override the entire console object
            window.console = {
                warn: function() {},
                log: function() {},
                error: function() {},
                info: function() {},
                debug: function() {},
                trace: function() {},
                assert: function() {},
                clear: function() {},
                count: function() {},
                dir: function() {},
                dirxml: function() {},
                group: function() {},
                groupCollapsed: function() {},
                groupEnd: function() {},
                profile: function() {},
                profileEnd: function() {},
                table: function() {},
                time: function() {},
                timeEnd: function() {},
                timeStamp: function() {}
            };
        </script>
        
        %sveltekit.head%
    </head>
    <body style="margin: 0; padding: 0; overflow: hidden; background-color: black">
        <div>%sveltekit.body%</div>
    </body>
</html>
